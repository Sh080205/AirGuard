<title>AirGuard-S3 Enclosure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: แถบหัว + พื้นที่ 3D + แผงขวา (ภาพรวม / ค่าที่ต้องวัด) — มือถือซ้อนลงล่าง
   โทนกระดาษงานช่าง น้ำเงินแบบร่างเป็นสีควบคุม ตัวกล่องใช้สีวัสดุที่เลือก */
:root{
  --paper:#eceff0; --panel:#f7f8f8; --ink:#17202a; --muted:#5a6672; --line:#d2d8dc; --field:#ffffff;
  --accent:#2350a8; --accent-ink:#ffffff; --ok:#2c7a4b; --warn:#b5531c; --keep:#cf3b3b;
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161b; --panel:#171d23; --ink:#e4e9ee; --muted:#97a3ae; --line:#2b343d; --field:#0f1418;
  --accent:#86a9f0; --accent-ink:#0d1420; --ok:#5cbf86; --warn:#ec8a52; --keep:#ef6a6a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161b; --panel:#171d23; --ink:#e4e9ee; --muted:#97a3ae; --line:#2b343d; --field:#0f1418;
  --accent:#86a9f0; --accent-ink:#0d1420; --ok:#5cbf86; --warn:#ec8a52; --keep:#ef6a6a; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 420px;grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;padding:10px 18px;border-bottom:1px solid var(--line)}
header h1{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0;text-wrap:balance}
header .sub{color:var(--muted);font-size:13px}
.dims{margin-left:auto;font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden}
canvas#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas#c:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:5px;pointer-events:auto;cursor:pointer;
  font-size:12px;white-space:nowrap;padding:2px 7px 2px 2px;border-radius:999px;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.pin b{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:500 11px var(--f-mono)}
.pin.out b{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.pin.dim{opacity:.18}
.pin.sel{outline:2px solid var(--accent)}
.pin::after{content:"";position:absolute;left:50%;bottom:-7px;width:1px;height:7px;background:var(--muted)}
.hide-names .pin span{display:none}
.hide-names .pin{padding-right:2px}
.toolbar{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 24px)}
.grp{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.grp button{font:500 12px var(--f-body);background:transparent;color:var(--ink);border:0;padding:6px 10px;cursor:pointer}
.grp button+button{border-left:1px solid var(--line)}
.grp button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,.row:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.swatches{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;max-width:calc(100% - 24px)}
.sw{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:3px 9px 3px 3px;font:500 12px var(--f-body);cursor:pointer}
.sw i{width:18px;height:18px;border-radius:999px;border:1px solid rgb(0 0 0 / .15)}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.panel{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;font:600 14px var(--f-display);background:transparent;color:var(--muted);border:0;padding:12px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.scroll{overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px;min-height:0}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:0}
.note strong{color:var(--ink)}
.note.warn{border-left-color:var(--warn)}
h2{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 -4px}
.row{display:grid;grid-template-columns:26px minmax(0,1fr);gap:2px 10px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--paper)}
.row:hover{border-color:var(--accent)}
.row.sel{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.row .no{display:grid;place-items:center;width:24px;height:24px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:500 12px var(--f-mono)}
.row.out .no{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.row .ti{font-weight:600;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .bd{grid-column:2;font-size:13px;color:var(--muted)}
.chip{font:500 11px var(--f-body);padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px}
/* ฟอร์มค่าที่ต้องวัด */
.mhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:sticky;top:-14px;background:var(--panel);padding:8px 0;z-index:1;border-bottom:1px solid var(--line)}
.mhead .count{font:500 13px var(--f-mono);color:var(--muted)}
.mhead button{margin-left:auto;font:600 13px var(--f-body);padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.mhead .status{flex-basis:100%;font-size:12px;color:var(--ok);min-height:1em}
fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px 12px;margin:0;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
legend{font:600 14px var(--f-display);padding:0 6px}
legend .tool{font:400 12px var(--f-body);color:var(--muted);margin-left:6px}
.m{display:grid;grid-template-columns:34px minmax(0,1fr);gap:2px 8px;align-items:start}
.m .code{font:500 12px var(--f-mono);color:var(--accent);padding-top:7px}
.m label{font-weight:500;font-size:13px}
.m .need{font:500 10.5px var(--f-body);color:var(--warn);margin-left:6px;white-space:nowrap}
.m .hint{grid-column:2;font-size:12px;color:var(--muted)}
.m input,.m select{grid-column:2;width:100%;box-sizing:border-box;font:400 13px var(--f-mono);padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
.m.filled .code::after{content:" ✓";color:var(--ok)}
textarea#out{width:100%;box-sizing:border-box;min-height:120px;font:12px var(--f-mono);border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);padding:8px}
.err{position:absolute;inset:auto 12px 70px 12px;color:var(--warn);font-size:13px}
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 60vh auto;height:auto}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .scroll{overflow:visible}
  .dims{margin-left:0}
  .mhead{top:0}
}
</style>

<div class="app" id="app">
  <header>
    <h1>AirGuard-S3 Enclosure</h1>
    <span class="sub">แบบอ้างอิงก่อนวัดจริง · จาก <span class="mono">airguard_enclosure.scad</span></span>
    <span class="dims" id="dims">กล่องนอก 174 × 107 × 43 mm (ค่าร่าง)</span>
  </header>

  <div class="stage" id="stage">
    <canvas id="c" aria-label="โมเดล 3 มิติของกล่อง ลากเพื่อหมุน"></canvas>
    <div id="labels"></div>
    <div class="toolbar">
      <div class="grp" role="group" aria-label="มุมมอง">
        <button id="v-iso" aria-pressed="true">มุมเฉียง</button>
        <button id="v-front" aria-pressed="false">หน้า</button>
        <button id="v-left" aria-pressed="false">ซ้าย</button>
        <button id="v-back" aria-pressed="false">หลัง</button>
        <button id="v-top" aria-pressed="false">บน</button>
      </div>
      <div class="grp" role="group" aria-label="ฝา">
        <button id="l-closed" aria-pressed="true">ปิดฝา</button>
        <button id="l-open" aria-pressed="false">ยกฝา</button>
        <button id="l-off" aria-pressed="false">ซ่อนฝา</button>
      </div>
      <div class="grp" role="group" aria-label="แสดงผล">
        <button id="t-xray" aria-pressed="false">มองทะลุ</button>
        <button id="t-inside" aria-pressed="true">ชิ้นภายใน</button>
        <button id="t-names" aria-pressed="true">ชื่อ</button>
      </div>
    </div>
    <div class="swatches" role="group" aria-label="สีตัวกล่อง">
      <span>สี</span>
      <button class="sw" data-c="ivory" aria-pressed="true"><i style="background:#e8e1d2"></i>งาช้าง</button>
      <button class="sw" data-c="greige" aria-pressed="false"><i style="background:#c9c3b8"></i>เทาอุ่น</button>
      <button class="sw" data-c="sage" aria-pressed="false"><i style="background:#b8c1ab"></i>เสจ</button>
      <button class="sw" data-c="wood" aria-pressed="false"><i style="background:linear-gradient(135deg,#e8e1d2 50%,#a77b52 50%)"></i>งาช้าง + ฝาไม้</button>
    </div>
    <div class="err" id="err" hidden></div>
  </div>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-ref" aria-selected="true">แบบอ้างอิง</button>
      <button role="tab" id="tab-meas" aria-selected="false">ค่าที่ต้องวัด</button>
    </div>
    <div class="scroll" id="pane-ref"></div>
    <div class="scroll" id="pane-meas" hidden></div>
  </aside>
</div>

function saveDraft(d){ try { localStorage.setItem(LS, JSON.stringify(d)); } catch(e){} }
const draft = loadDraft();
const total = MEAS.reduce((n,s)=>n+s.items.length,0);
const pm = document.getElementById('pane-meas');
pm.innerHTML = `

  ${MEAS.map(s=>`<fieldset><legend>${s.g} · ${s.t}${s.tool?`<span class="tool">${s.tool}</span>`:''}</legend>
    ${s.items.map(([c,l,u,h,need])=>`<div class="m" id="m-${c}"><span class="code">${c}</span>
      <label for="f-${c}">${l}${u?` <span class="mono" style="color:var(--muted)">(${u})</span>`:''}${need?'<span class="need">ต้องมีก่อนสั่งพิมพ์</span>':''}</label>
      ${h?`<span class="hint">${h}</span>`:''}
      <input id="f-${c}" data-c="${c}" autocomplete="off" value="${(draft[c]||'').replace(/"/g,'&quot;')}"></div>`).join('')}
  </fieldset>`).join('')}
  <label for="out" class="mono" style="color:var(--muted)">ข้อความที่จะคัดลอก (เลือกเองได้ถ้าปุ่มคัดลอกใช้ไม่ได้)</label>
  <textarea id="out" readonly></textarea>`;
function buildText(){
  const lines = ['ค่าวัด AirGuard-S3 enclosure'];
  for (const s of MEAS){ lines.push(`[${s.g}] ${s.t}`);
    for (const [c,l,u] of s.items){ const v=(draft[c]||'').trim(); lines.push(`${c} ${l}: ${v||'-'}${v&&u&&/^[\d.\s×x,+-]+$/.test(v)?' '+u:''}`); } }
  return lines.join('\n');
}
function refreshForm(){
  let n=0; for (const s of MEAS) for (const [c] of s.items){ const f=!!(draft[c]||'').trim(); if(f) n++; document.getElementById('m-'+c).classList.toggle('filled', f); }
  document.getElementById('cnt').textContent = `กรอกแล้ว ${n} / ${total}`;
  document.getElementById('out').value = buildText();
}
pm.addEventListener('input', e=>{ if(e.target.dataset.c){ draft[e.target.dataset.c]=e.target.value; saveDraft(draft); refreshForm(); }});
document.getElementById('copy').addEventListener('click', ()=>{
  const t = buildText(), st=document.getElementById('cst');
  const fallback = ()=>{ const o=document.getElementById('out'); o.focus(); o.select(); st.textContent='เลือกข้อความให้แล้ว กด Ctrl+C / ⌘C เพื่อคัดลอก'; };
  try { navigator.clipboard.writeText(t).then(()=>{ st.textContent='คัดลอกแล้ว วางในแชทได้เลย'; }, fallback); } catch(e){ fallback(); }
});
refreshForm();

/* ---------- state ---------- */
let lidState='closed', lidZ=0, lidTarget=0, xray=false, showInside=true, selected=null;
function applyShell(){
  const xo = xray ? 0.22 : 1;
  bodyMat.transparent = xray; bodyMat.opacity = xo; bodyMat.depthWrite = !xray;
  lidMat.transparent = xray || lidState==='open'; lidMat.opacity = xray ? 0.22 : (lidState==='open'?0.92:1); lidMat.depthWrite = !xray;
  G.lid.group.visible = lidState!=='off';
  lidTarget = lidState==='open' ? 46 : 0;
  inside.visible = showInside;
  refreshPins();
}
function insideVisible(){ return showInside && (lidState!=='closed' || xray); }
function refreshPins(){ for (const p of pins){ p.el.hidden = !p.out && !insideVisible(); if (p.out && p.it.g[0]==='lid' && lidState==='off') p.el.hidden = true; } }
function press(groupIds, id){ for (const g of groupIds) document.getElementById(g).setAttribute('aria-pressed', g===id); }
for (const [id,st] of [['l-closed','closed'],['l-open','open'],['l-off','off']])
  document.getElementById(id).addEventListener('click',()=>{ lidState=st; press(['l-closed','l-open','l-off'],id); applyShell(); });
function toggle(id, fn){ const b=document.getElementById(id); b.addEventListener('click',()=>{ const on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on); fn(on); }); }
toggle('t-xray', on=>{ xray=on; applyShell(); });
toggle('t-inside', on=>{ showInside=on; applyShell(); });
toggle('t-names', on=>document.getElementById('app').classList.toggle('hide-names',!on));
if (innerWidth<600){ document.getElementById('app').classList.add('hide-names'); document.getElementById('t-names').setAttribute('aria-pressed','false'); }
document.querySelectorAll('.sw').forEach(b=>b.addEventListener('click',()=>{
  const [c1,c2]=COLORS[b.dataset.c]; bodyMat.color.set(c1); lidMat.color.set(c2);
  lidMat.roughness = b.dataset.c==='wood' ? 0.7 : 0.88;
  document.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed', x===b));
}));

function select(id, fly){
  selected = id;
  const it = ALL.find(x=>x.id===id); if(!it) return;
  if (!OUT.includes(it) && lidState==='closed' && !xray){ lidState='open'; press(['l-closed','l-open','l-off'],'l-open'); applyShell(); }
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('sel', r.dataset.id===id));
  pins.forEach(p=>{ p.el.classList.toggle('sel',p.it.id===id); p.el.classList.toggle('dim',p.it.id!==id); });
  if (fly) flyTo(it.at, OUT.includes(it));
  const r=document.querySelector(`.row[data-id="${id}"]`); if(r && fly) r.scrollIntoView({block:'nearest',behavior:reduceMotion?'auto':'smooth'});
}
function clearSel(){ selected=null; document.querySelectorAll('.row').forEach(r=>r.classList.remove('sel')); pins.forEach(p=>p.el.classList.remove('sel','dim')); }
let down=null; canvas.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
canvas.addEventListener('pointerup',e=>{ if(down && Math.hypot(e.clientX-down[0],e.clientY-down[1])<4) clearSel(); down=null; });

/* ---------- camera ---------- */
const VIEWS = { iso:{pos:[-170,170,250],tgt:[0,0,0]}, front:{pos:[0,40,320],tgt:[0,5,0]}, left:{pos:[-320,50,0],tgt:[0,5,0]},
  back:{pos:[0,60,-320],tgt:[0,5,0]}, top:{pos:[0.01,340,0.01],tgt:[0,0,0]} };
let anim=null;
function animateCam(pos,tgt){ const p0=camera.position.clone(),t0=controls.target.clone(),p1=new THREE.Vector3(...pos),t1=new THREE.Vector3(...tgt);
  if(reduceMotion){ camera.position.copy(p1); controls.target.copy(t1); return; }
  const s=performance.now(); anim=(now)=>{ const k=Math.min(1,(now-s)/650), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(p0,p1,e); controls.target.lerpVectors(t0,t1,e); if(k>=1) anim=null; }; }
function setView(n){ animateCam(VIEWS[n].pos, VIEWS[n].tgt); press(Object.keys(VIEWS).map(k=>'v-'+k),'v-'+n); }
for (const n of Object.keys(VIEWS)) document.getElementById('v-'+n).addEventListener('click',()=>setView(n));
function flyTo(at, outside){
  const w = root.localToWorld(new THREE.Vector3(...at));
  let dir = camera.position.clone().sub(controls.target).normalize();
  if (outside){ // หันกล้องเข้าหาผนังที่มีช่องนั้น
    const [x,y]=at; const d = y < 0 ? [0,0.35,1] : y > 99 ? [0,0.35,-1] : x < -78 ? [-1,0.35,0] : [-0.3,1,0.6];
    dir = new THREE.Vector3(...d).normalize(); }
  animateCam(w.clone().add(dir.multiplyScalar(210)).toArray(), w.toArray());
  press(Object.keys(VIEWS).map(k=>'v-'+k), null);
}

  pr.hidden = t!=='ref'; pm.hidden = t!=='meas'; }
document.getElementById('tab-ref').onclick=()=>setTab('ref');
document.getElementById('tab-meas').onclick=()=>setTab('meas');

/* ---------- loop ---------- */
function resize(){ const r=stage.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); camera.aspect=r.width/Math.max(1,r.height); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);
const tmp=new THREE.Vector3();
function frame(now){
  if(anim) anim(now); controls.update();
  lidZ += (lidTarget-lidZ) * (reduceMotion?1:0.15); G.lid.group.position.z = lidZ;
  renderer.render(scene,camera);
  const r=stage.getBoundingClientRect();
  for (const p of pins){ if(p.el.hidden) continue;
    tmp.copy(p.v); if (p.out && p.it.g[0]==='lid') tmp.z += lidZ;
    root.localToWorld(tmp); tmp.project(camera);
    p.el.style.left=((tmp.x*0.5+0.5)*r.width)+'px'; p.el.style.top=((-tmp.y*0.5+0.5)*r.height-6)+'px';
    p.el.style.visibility = tmp.z>1 ? 'hidden':'visible'; }
  requestAnimationFrame(frame);
}
camera.position.set(...VIEWS.iso.pos); controls.target.set(0,0,0);
applyShell(); resize(); requestAnimationFrame(frame);
</script>
